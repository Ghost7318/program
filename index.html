<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プログラム作成ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f4f7f6; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-area { display: flex; flex-direction: column; gap: 8px; padding: 15px; border: 2px solid #007bff; border-radius: 8px; background: #eef7ff; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .btn { cursor: pointer; padding: 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 14px; width: 100%; margin-top: 5px; }
        .btn-add { background: #28a745; color: white; }
        .btn-del { background: #dc3545; color: white; padding: 4px 8px; font-size: 12px; }
        .table-wrapper { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #eee; }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <h2 style="margin-top:0;">プログラム作成ツール</h2>
        <input type="text" id="progTitle" value="カラオケ発表会 プログラム" style="width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 10px;">
        
        <div class="input-area">
            <select id="type" onchange="toggleInputs()">
                <option value="song">曲目入力</option>
                <option value="break">休憩・その他</option>
            </select>
            <input type="number" id="inputSeq" placeholder="順番（曲目のみ）">
            <input type="text" id="name" placeholder="名前">
            <input type="text" id="song" placeholder="曲名">
            <input type="text" id="artist" placeholder="歌手名">
            <input type="text" id="key" placeholder="キー">
            <select id="bento"><option value="なし">弁当なし</option><option value="あり">弁当あり</option></select>
            <input type="text" id="break-text" placeholder="内容" style="display:none;">
            <button class="btn btn-add" onclick="addRow()">追加する</button>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px;">
            <button class="btn" onclick="saveData()">💾 保存</button>
            <button class="btn" onclick="document.getElementById('fileInput').click()">📁 読み込み</button>
            <input type="file" id="fileInput" style="display:none" onchange="loadData(event)">
            <button class="btn" style="background:#007bff; color:white; grid-column: span 2;" onclick="exportPDF()">📄 PDFで保存</button>
        </div>
    </div>

    <div id="preview-box">
        <h2 id="displayTitle" style="text-align:center;">カラオケ発表会 プログラム</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th class="col-drag">並</th><th>順</th><th>名前</th><th>曲名</th><th>歌手名</th><th>キー</th><th>弁当</th><th class="col-ctrl">操作</th></tr>
                </thead>
                <tbody id="sortable-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    new Sortable(document.getElementById('sortable-list'), { animation: 150, onEnd: renumber });

    function toggleInputs() {
        const isBreak = document.getElementById('type').value === 'break';
        ['inputSeq', 'name', 'song', 'artist', 'key', 'bento'].forEach(id => document.getElementById(id).style.display = isBreak ? 'none' : 'block');
        document.getElementById('break-text').style.display = isBreak ? 'block' : 'none';
    }

    function addRow(data = null) {
        const tbody = document.getElementById("sortable-list");
        const type = data ? data.type : document.getElementById('type').value;
        const row = document.createElement('tr');
        
        if (type === 'break') {
            const val = data ? data.text : document.getElementById('break-text').value;
            row.innerHTML = `<td class="col-drag">☰</td><td class="num">-</td><td colspan="5"><b>${val}</b></td><td class="col-ctrl"><button class="btn-del" onclick="removeRow(this)">削除</button></td>`;
        } else {
            row.innerHTML = `<td class="col-drag">☰</td><td class="num">${data ? data.seq : document.getElementById('inputSeq').value}</td><td>${data ? data.name : document.getElementById('name').value}</td><td>${data ? data.song : document.getElementById('song').value}</td><td>${data ? data.artist : document.getElementById('artist').value}</td><td>${data ? data.key : document.getElementById('key').value}</td><td>${data ? data.bento : document.getElementById('bento').value}</td><td class="col-ctrl"><button class="btn-del" onclick="removeRow(this)">削除</button></td>`;
        }
        tbody.appendChild(row);
        renumber();
    }

    function removeRow(btn) { btn.parentElement.parentElement.remove(); renumber(); }
    function renumber() { 
        let count = 1;
        document.querySelectorAll('#sortable-list tr').forEach((row) => {
            const numCell = row.querySelectorAll('td')[1];
            if (numCell && numCell.innerText !== '-') numCell.innerText = count++;
        });
    }

    function toggleColumns(hide) {
        const display = hide ? 'none' : '';
        document.querySelectorAll('.col-drag, .col-ctrl').forEach(el => el.style.display = display);
    }

    // スマホでの真っ白対策：少し待ってから実行する
    async function exportPDF() {
        toggleColumns(true);
        document.getElementById('displayTitle').innerText = document.getElementById('progTitle').value;
        
        // 少しだけ待機して描画を完了させる
        await new Promise(resolve => setTimeout(resolve, 300));
        
        const opt = { 
            margin: 5, 
            filename: 'プログラム.pdf', 
            html2canvas: { scale: 1.5, useCORS: true }, // スマホ負荷軽減のためscaleを少し下げました
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };
        
        html2pdf().set(opt).from(document.getElementById('preview-box')).save().then(() => toggleColumns(false));
    }

    function saveData() {
        const data = { title: document.getElementById('progTitle').value, rows: [] };
        document.querySelectorAll('#sortable-list tr').forEach(tr => {
            const tds = tr.querySelectorAll('td');
            if (tds[2].colSpan === 5) {
                data.rows.push({ type: 'break', text: tds[2].innerText });
            } else {
                data.rows.push({ type: 'song', seq: tds[1].innerText, name: tds[2].innerText, song: tds[3].innerText, artist: tds[4].innerText, key: tds[5].innerText, bento: tds[6].innerText });
            }
        });
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'program.json'; a.click();
    }

    function loadData(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = JSON.parse(e.target.result);
            document.getElementById('progTitle').value = data.title;
            document.getElementById('sortable-list').innerHTML = '';
            data.rows.forEach(r => addRow(r));
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
